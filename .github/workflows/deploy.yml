name: Deploy ohm-map

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply runtime env overrides
        env:
          OHM_TILESERVER: ${{ vars.TILESERVER }}
          OHM_MAPTILER_KEY: ${{ vars.MAPTILER_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "src/assets/env.json";
            const env = JSON.parse(fs.readFileSync(path, "utf8"));
            const overrides = {
              TILESERVER: process.env.OHM_TILESERVER,
              MAPTILER_KEY: process.env.OHM_MAPTILER_KEY,
            };
            for (const [k, v] of Object.entries(overrides)) if (v) env[k] = v;
            fs.writeFileSync(path, JSON.stringify(env, null, 2));
          '

      - name: Build
        run: npx ng build --configuration production --base-href "${{ vars.BASE_HREF || '/' }}"

      - name: Add SPA fallbacks
        run: |
          cp dist/ohm-map/browser/index.html dist/ohm-map/browser/404.html
          printf '/*    /index.html   200\n' > dist/ohm-map/browser/_redirects

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ohm-map/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
